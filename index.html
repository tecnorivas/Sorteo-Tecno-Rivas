<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sorteo Tecno Rivas - Registro de Factura</title>
  
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <main class="container">
    <div id="formWrap" class="card">
      <div class="banner-container">
        <!-- Banner de Tecno Rivas -->
        <img src="https://tecnorivas.github.io/Sorteo-Tecno-Rivas/banner.png" alt="Sorteo Tecno Rivas" class="banner-img" onerror="this.style.display='none'">
      </div>

      <div class="card-header">
        <h1>Sorteo Tecno Rivas</h1>
        <p>Registrá tu factura para participar en la canasta escolar</p>
      </div>
      
      <form id="f">
        <div class="field">
          <label for="ced"><i class="fa-solid fa-id-card"></i> Número de Cédula</label>
          <input id="ced" name="cedula" type="text" placeholder="Ej: 431-000000-0000A" required autocomplete="off">
        </div>
        
        <div class="field">
          <label for="tel"><i class="fa-solid fa-phone"></i> Teléfono WhatsApp</label>
          <input id="tel" name="telefono" type="tel" inputmode="tel" placeholder="Ej: 8888-8888" required autocomplete="off">
        </div>
        
        <div class="field">
          <label for="fac"><i class="fa-solid fa-file-invoice"></i> Nº de Factura</label>
          <input id="fac" name="factura" type="text" placeholder="Ej: FAC-00123" required autocomplete="off">
        </div>
        
        <div class="field">
          <label for="tot"><i class="fa-solid fa-money-bill-wave"></i> Total de la Factura (C$)</label>
          <input id="tot" name="total" type="number" step="0.01" min="1500" placeholder="Mínimo C$ 1,500.00" required autocomplete="off">
          <small class="hint">Aplica únicamente para compras iguales o mayores a C$ 1,500.00</small>
        </div>
        
        <button type="submit" id="btn">
          <span>Participar Ahora</span>
          <i class="fa-solid fa-paper-plane"></i>
        </button>
        
        <div id="msg"></div>
      </form>
    </div>
    
    <div class="card done" id="done">
      <div class="done-badge">
        <i class="fa-solid fa-trophy"></i>
      </div>
      <h1>¡Ya estás participando!</h1>
      <p>Tu factura fue registrada exitosamente en el Sorteo Tecno Rivas.</p>
      <button onclick="location.reload()" class="btn-secondary">
        <i class="fa-solid fa-rotate-right"></i> Registrar otra factura
      </button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
