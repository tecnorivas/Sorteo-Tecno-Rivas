<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro de Factura Tecno Rivas</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
    font-family: 'Poppins', sans-serif; 
  }
  
  body {
    min-height: 100vh;
    background-color: #0b1120; /* Fondo súper oscuro premium */
    display: flex; 
    align-items: center; 
    justify-content: center; 
    padding: 20px; 
    color: #ffffff;
    overflow-x: hidden; /* Para que las luces no hagan scroll */
    position: relative;
    padding-top: 40px; /* Un poco de aire arriba */
  }

  /* Luces épicas de fondo (orbes flotantes) */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    z-index: 0;
    animation: float 15s infinite ease-in-out alternate;
  }
  .orb-1 {
    width: 350px; height: 350px;
    background: rgba(34, 197, 94, 0.35); /* Verde vibrante */
    top: -50px; left: -50px;
  }
  .orb-2 {
    width: 450px; height: 450px;
    background: rgba(14, 165, 233, 0.25); /* Azul tech */
    bottom: -100px; right: -50px;
    animation-delay: -5s;
    animation-duration: 20s;
  }

  @keyframes float {
    0% { transform: translateY(0px) translateX(0px) scale(1); }
    100% { transform: translateY(50px) translateX(30px) scale(1.1); }
  }

  main { 
    width: 100%; 
    max-width: 420px; 
    z-index: 1; /* Para que esté por encima de las luces */
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 24px; /* Espacio entre las secciones */
  }
  
  /* Animación de entrada de la tarjeta */
  .glass-panel {
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-top: 1px solid rgba(255, 255, 255, 0.2);
    border-left: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 24px;
    padding: 30px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    opacity: 0; /* Empieza invisible para la animación */
  }

  @keyframes slideUpFade {
    from { opacity: 0; transform: translateY(40px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Sección de la Imagen Hero */
  .hero {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px; /* Menos padding interno para que la imagen sea protagonista */
  }

  .hero-image {
    width: 100%;
    height: auto;
    border-radius: 16px;
    object-fit: cover;
    aspect-ratio: 1 / 1; /* Mantiene la proporción cuadrada original */
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  }

  h1 { 
    font-size: 1.9rem; 
    font-weight: 700; 
    text-align: center; 
    margin-bottom: 8px; 
    background: linear-gradient(135deg, #4ade80, #3b82f6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
  }
  
  p.sub { 
    text-align: center; 
    font-size: 0.9rem; 
    color: #94a3b8; 
    margin-bottom: 30px; 
  }

  form { 
    display: flex; 
    flex-direction: column; 
    gap: 20px; 
  }
  
  label {
    display: block; 
    font-size: 0.85rem; 
    color: #e2e8f0; 
    margin-bottom: 8px; 
    font-weight: 500; 
    letter-spacing: 0.5px;
  }
  
  input {
    width: 100%; 
    padding: 15px 16px; 
    font-size: 1rem;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 14px; 
    color: #ffffff; 
    transition: all 0.3s ease;
  }
  
  input::placeholder { color: rgba(255, 255, 255, 0.2); }
  
  input:focus { 
    outline: none; 
    border-color: #4ade80; 
    background: rgba(0, 0, 0, 0.6); 
    box-shadow: 0 0 20px rgba(74, 222, 128, 0.15); 
    transform: translateY(-2px);
  }
  
  button {
    margin-top: 10px; 
    padding: 16px; 
    border: none; 
    border-radius: 14px;
    background: linear-gradient(135deg, #22c55e, #10b981);
    color: white; 
    font-size: 1.1rem; 
    font-weight: 600;
    cursor: pointer; 
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
    position: relative;
    overflow: hidden;
  }
  
  /* Efecto de rayo de luz en el botón */
  button::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    transform: skewX(-20deg);
    animation: shine 3s infinite;
  }

  @keyframes shine {
    0% { left: -100%; }
    20% { left: 200%; }
    100% { left: 200%; }
  }

  button:hover:not(:disabled) { 
    transform: translateY(-3px); 
    box-shadow: 0 8px 25px rgba(34, 197, 94, 0.6); 
  }
  
  button:disabled { 
    opacity: 0.6; 
    cursor: not-allowed; 
    background: #475569;
    box-shadow: none;
  }
  
  #msg { 
    margin-top: 15px; 
    font-size: 0.85rem; 
    text-align: center; 
    display: none; 
    padding: 12px; 
    border-radius: 10px; 
  }
  
  #msg.show { 
    display: block; 
    animation: bounceIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; 
  }
  
  #msg.error { 
    background: rgba(220, 38, 38, 0.15); 
    color: #fca5a5; 
    border: 1px solid rgba(220, 38, 38, 0.3); 
  }
  
  .done { 
    display: none; 
    text-align: center; 
    padding: 30px 20px; 
  }
  
  .done.show { 
    display: block; 
    animation: scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
  }
  
  .done-icon {
    font-size: 4rem;
    margin-bottom: 15px;
    animation: pulse 2s infinite;
  }

  .done h1 { 
    background: none;
    color: #4ade80; 
    -webkit-text-fill-color: #4ade80;
    margin-bottom: 10px; 
  }
  
  @keyframes bounceIn { 
    0% { opacity: 0; transform: scale(0.9); } 
    100% { opacity: 1; transform: scale(1); } 
  }

  @keyframes scaleIn { 
    0% { opacity: 0; transform: scale(0.8) translateY(20px); } 
    100% { opacity: 1; transform: scale(1) translateY(0); } 
  }

  @keyframes pulse {
    0% { transform: scale(1); text-shadow: 0 0 0 rgba(74, 222, 128, 0.7); }
    50% { transform: scale(1.1); text-shadow: 0 0 20px rgba(74, 222, 128, 0.5); }
    100% { transform: scale(1); text-shadow: 0 0 0 rgba(74, 222, 128, 0); }
  }
</style>
</head>
<body>

<!-- Las luces de fondo -->
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<main>
  <!-- Sección de la Canasta (Hero) con la imagen super cool -->
  <div class="hero glass-panel">
    <img src="imagen_canasta.png" alt="Canasta de útiles escolares de Tecno Rivas" class="hero-image">
  </div>

  <!-- Panel del Formulario -->
  <div id="formWrap" class="glass-panel">
    <h1>Registro de Factura</h1>
    <p class="sub">Ingresá tus datos para validar el ticket.</p>
    <form id="f">
      <div>
        <label for="ced">Número de cédula</label>
        <input id="ced" name="cedula" type="text" placeholder="000-000000-0000A" required autocomplete="off">
      </div>
      <div>
        <label for="tel">Número de teléfono</label>
        <input id="tel" name="telefono" type="tel" inputmode="tel" placeholder="8888-8888" required autocomplete="off">
      </div>
      <div>
        <label for="fac">Número de factura</label>
        <input id="fac" name="factura" type="text" inputmode="numeric" placeholder="FAC-00123" required autocomplete="off">
      </div>
      <div>
        <label for="tot">Total de la factura (C$)</label>
        <input id="tot" name="total" type="number" step="0.01" min="0" placeholder="1500.00" required autocomplete="off">
      </div>
      <button type="submit" id="btn">Validar y Guardar</button>
      <div id="msg"></div>
    </form>
  </div>
  
  <!-- Panel de Éxito -->
  <div class="done glass-panel" id="done">
    <div class="done-icon">✅</div>
    <h1>¡Éxito!</h1>
    <p class="sub">Tu registro ha sido guardado y verificado correctamente.</p>
  </div>
</main>

<script>
  // pegá tu nuevo link de google apps script aquí
  const ENDPOINT_URL = "la_url_vieja_que_tenias";

  const form = document.getElementById('f');
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = ''; msg.textContent = '';
    
    const cedula = document.getElementById('ced').value.trim();
    const telefono = document.getElementById('tel').value.trim();
    const factura = document.getElementById('fac').value.trim();
    const total = parseFloat(document.getElementById('tot').value.trim());

    if (total < 1500) {
      msg.className = 'show error';
      msg.textContent = 'El total de la factura debe ser de al menos C$ 1,500.00 para aplicar.';
      return;
    }

    if (ENDPOINT_URL === "tu_nuevo_link_aqui" || ENDPOINT_URL.includes('PEGA_AQUI')) {
      msg.className = 'show error';
      msg.textContent = 'Falta configurar la URL del sistema interno.';
      return;
    }

    btn.disabled = true; btn.textContent = 'Verificando datos...';

    try {
      const res = await fetch(ENDPOINT_URL, { redirect: 'follow' });
      const facturasUsadas = await res.json();

      if (facturasUsadas.includes(factura)) {
        msg.className = 'show error';
        msg.textContent = '🚨 ¡Esta factura ya fue registrada! Revisá bien los datos.';
        btn.disabled = false; btn.textContent = 'Validar y Guardar';
        return;
      }

      btn.textContent = 'Guardando registro...';

      await fetch(ENDPOINT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ cedula, telefono, factura, total })
      });
      document.getElementById('formWrap').style.display = 'none';
      document.getElementById('done').classList.add('show');
    } catch (err) {
      msg.className = 'show error';
      msg.textContent = 'Error de conexión. Revisá tu internet e intentá de nuevo.';
      btn.disabled = false; btn.textContent = 'Validar y Guardar';
    }
  });
</script>
</body>
</html>
