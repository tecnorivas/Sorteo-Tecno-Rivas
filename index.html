<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sorteo Canasta Escolar - Tecno Rivas</title>
  
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <!-- Elementos flotantes de librería / escolar -->
  <div class="school-decorations">
    <i class="fa-solid fa-pencil float-item p1"></i>
    <i class="fa-solid fa-book float-item p2"></i>
    <i class="fa-solid fa-ruler-combined float-item p3"></i>
    <i class="fa-solid fa-graduation-cap float-item p4"></i>
    <i class="fa-solid fa-palette float-item p5"></i>
  </div>

  <main class="container">
    <div id="formWrap" class="card">
      
      <!-- Encabezado escolar Tecno Rivas -->
      <div class="banner-school">
        <div class="badge-tag">
          <i class="fa-solid fa-graduation-cap"></i> Temporada Escolar
        </div>
        <div class="school-icons-hero">
          <i class="fa-solid fa-book-bookmark"></i>
          <i class="fa-solid fa-basket-shopping"></i>
          <i class="fa-solid fa-pen-ruler"></i>
        </div>
        <h1>Gran Sorteo Escolar</h1>
        <p>¡Gánate una Canasta de Útiles con Tecno Rivas!</p>
      </div>

      <div class="card-body">
        <form id="f">
          <div class="field">
            <label for="ced"><i class="fa-solid fa-id-card"></i> Número de Cédula</label>
            <input id="ced" name="cedula" type="text" placeholder="Ej: 431-000000-0000A" required autocomplete="off">
          </div>
          
          <div class="field">
            <label for="tel"><i class="fa-solid fa-phone"></i> Teléfono WhatsApp</label>
            <input id="tel" name="telefono" type="tel" inputmode="tel" placeholder="Ej: 8888-8888" required autocomplete="off">
          </div>
          
          <div class="field">
            <label for="fac"><i class="fa-solid fa-receipt"></i> Nº de Factura</label>
            <input id="fac" name="factura" type="text" placeholder="Ej: FAC-00123" required autocomplete="off">
          </div>
          
          <div class="field">
            <label for="tot"><i class="fa-solid fa-sack-dollar"></i> Total de la Factura (C$)</label>
            <input id="tot" name="total" type="number" step="0.01" min="1500" placeholder="Ej: 1500.00" required autocomplete="off">
            <small class="hint"><i class="fa-solid fa-circle-info"></i> Participan facturas desde C$ 1,500.00 en adelante.</small>
          </div>
          
          <button type="submit" id="btn">
            <span>Registrar Factura</span>
            <i class="fa-solid fa-paper-plane"></i>
          </button>
          
          <div id="msg"></div>
        </form>
      </div>
    </div>
    
    <!-- Pantalla de Éxito -->
    <div class="card done" id="done">
      <div class="done-badge">
        <i class="fa-solid fa-gift"></i>
      </div>
      <h1>¡Factura Registrada!</h1>
      <p>Ya estás participando en el sorteo de la Canasta Escolar de Tecno Rivas. ¡Mucha suerte!</p>
      <button onclick="location.reload()" class="btn-secondary">
        <i class="fa-solid fa-rotate-right"></i> Registrar otra factura
      </button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
